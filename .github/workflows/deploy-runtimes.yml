# ═══════════════════════════════════════════════════════════════════════
# Build & Publish Runtime Container Images to GHCR
# ═══════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - Push to main when runtimes/ files change
#   - Manual dispatch (workflow_dispatch) with runtime selection
#
# Publishes to:
#   ghcr.io/jarble-ai/openclaw:latest  (+ :sha tag)
#   ghcr.io/jarble-ai/zeroclaw:latest  (+ :sha tag)
# ═══════════════════════════════════════════════════════════════════════

name: Build Runtime Images

on:
  push:
    branches: [main]
    paths:
      - "runtimes/**"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Which runtime to build"
        required: true
        type: choice
        options:
          - all
          - openclaw
          - zeroclaw

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jarble-ai

permissions:
  contents: read
  packages: write

jobs:
  # ── Detect which runtimes changed ──────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      openclaw: ${{ steps.filter.outputs.openclaw }}
      zeroclaw: ${{ steps.filter.outputs.zeroclaw }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            openclaw:
              - 'runtimes/openclaw/**'
            zeroclaw:
              - 'runtimes/zeroclaw/**'

      # On manual dispatch, use the selected runtime
      - name: Set manual dispatch outputs
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          if [ "${{ inputs.runtime }}" = "all" ] || [ "${{ inputs.runtime }}" = "openclaw" ]; then
            echo "openclaw=true" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.runtime }}" = "all" ] || [ "${{ inputs.runtime }}" = "zeroclaw" ]; then
            echo "zeroclaw=true" >> $GITHUB_OUTPUT
          fi

  # ── Build & Push OpenClaw ──────────────────────────────────────────
  build-openclaw:
    needs: changes
    if: |
      needs.changes.outputs.openclaw == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.runtime == 'all' || inputs.runtime == 'openclaw'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/openclaw
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push OpenClaw
        uses: docker/build-push-action@v5
        with:
          context: runtimes/openclaw
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & Push ZeroClaw ──────────────────────────────────────────
  build-zeroclaw:
    needs: changes
    if: |
      needs.changes.outputs.zeroclaw == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.runtime == 'all' || inputs.runtime == 'zeroclaw'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/zeroclaw
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push ZeroClaw
        uses: docker/build-push-action@v5
        with:
          context: runtimes/zeroclaw
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
