# ═══════════════════════════════════════════════════════════════════════
# CI — The single gate for all PRs and post-merge verification
# ═══════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - All PRs targeting develop or main
#   - Push to develop or main (post-merge verification)
#
# Jobs run in parallel where possible. Frontend build depends on tests.
# Configure these as required status checks in GitHub branch protection
# to block merges when CI fails:
#   - "Typecheck — API"
#   - "Typecheck — Frontend"
#   - "Test — API"
#   - "Test — Frontend"
#   - "Build — Frontend"
#   - "Manifest Sync"
# ═══════════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Label PRs by changed paths ────────────────────────────────────
  label:
    name: Label PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # ── API ───────────────────────────────────────────────────────────
  typecheck-api:
    name: Typecheck — API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarble-api-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarble-api-main/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test-api:
    name: Test — API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarble-api-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarble-api-main/package-lock.json
      - run: npm ci
      - run: npm run test

  # ── Frontend ──────────────────────────────────────────────────────
  typecheck-frontend:
    name: Typecheck — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jarble-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml
      # API types needed for frontend typecheck
      - run: cd ../jarble-api-main && npm ci && npm run build:types
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  test-frontend:
    name: Test — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jarble-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build-frontend:
    name: Build — Frontend
    runs-on: ubuntu-latest
    needs: [typecheck-frontend, test-frontend]
    defaults:
      run:
        working-directory: Jarble-mvp
    env:
      NEXT_PUBLIC_API_URL: https://api.jarble.ai
      NEXT_PUBLIC_AUTH0_DOMAIN: jarble-dev.us.auth0.com
      NEXT_PUBLIC_AUTH0_CLIENT_ID: placeholder
      NEXT_PUBLIC_AUTH0_AUDIENCE: https://api.jarble.ai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml
      - run: cd ../jarble-api-main && npm ci && npm run build:types
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # ── Shared ────────────────────────────────────────────────────────
  manifest-check:
    name: Manifest Sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jarble-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:manifest
