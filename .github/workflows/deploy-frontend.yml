# ═══════════════════════════════════════════════════════════════════════
# Build & Publish Frontend Container Image to GHCR
# ═══════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - Push to main when Jarble-mvp/, shared/, or API tRPC types change
#   - Manual dispatch
#
# Publishes to:
#   ghcr.io/jarble-ai/frontend:latest  (+ :sha tag)
# ═══════════════════════════════════════════════════════════════════════

name: Build Frontend Image

on:
  push:
    branches: [main]
    paths:
      - "Jarble-mvp/**"
      - "shared/**"
      - "jarble-api-main/src/trpc/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jarble-ai/frontend

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Jarble-mvp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.jarble.ai
            NEXT_PUBLIC_APP_URL=https://jarble.ai
            NEXT_PUBLIC_AUTH0_DOMAIN=${{ secrets.AUTH0_DOMAIN }}
            NEXT_PUBLIC_AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}
            NEXT_PUBLIC_AUTH0_AUDIENCE=https://api.jarble.ai
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
