name: Build & Push API Image

on:
  push:
    branches: [main, develop]
    paths:
      - 'jarble-api-main/**'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jarble-ai/api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: jarble-api-main/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── JAR-50 follow-up: trigger Kubero rollout so prod actually picks up
      # the new :latest image. Kubero in `docker` deployment-strategy mode does
      # NOT poll the registry, so even with `autodeploy: true` and
      # `pullPolicy: Always` the running pod keeps the old image until something
      # restarts it. We SSH into the master and run `kubectl rollout restart`
      # which forces K8s to pull the new :latest tag and start a fresh pod.
      # The new pod's CMD invokes migrate.pg.js so any pending DB migration
      # runs automatically before the API server boots.
      #
      # Required secrets:
      #   K3S_SSH_HOST          — e.g. 178.156.230.13
      #   K3S_SSH_USER          — e.g. root
      #   K3S_SSH_PRIVATE_KEY   — the private key half of an authorized key
      #
      # If any secret is missing the step is skipped, not failed, so the
      # build still succeeds (image is on GHCR; manual rollout is the
      # fallback).
      - name: Trigger prod rollout (ssh + kubectl)
        if: github.ref == 'refs/heads/develop' && env.K3S_SSH_HOST != ''
        env:
          K3S_SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          K3S_SSH_USER: ${{ secrets.K3S_SSH_USER }}
          K3S_SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$K3S_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$K3S_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$K3S_SSH_USER@$K3S_SSH_HOST" \
            "kubectl -n jarble-production rollout restart deploy jarble-api-kuberoapp-web && kubectl -n jarble-production rollout status deploy jarble-api-kuberoapp-web --timeout=180s"
          echo "✅ prod rollout triggered + completed"
