# ═══════════════════════════════════════════════════════════════════════
# PR Validation Checks
# ═══════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - Pull request to main
#
# Runs typecheck, tests, and manifest sync in parallel.
# ═══════════════════════════════════════════════════════════════════════

name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-api:
    name: Typecheck — API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarble-api-main
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jarble-api-main/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm run typecheck

  typecheck-frontend:
    name: Typecheck — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jarble-mvp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm run check

  test-api:
    name: Test — API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarble-api-main
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jarble-api-main/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test

  test-frontend:
    name: Test — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jarble-mvp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test

  manifest-check:
    name: Manifest Sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jarble-mvp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Jarble-mvp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check manifest ↔ component sync
        run: pnpm run check:manifest
