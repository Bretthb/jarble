# ═══════════════════════════════════════════════════════════════════════
# Terraform — Plan, Apply & Manage Hetzner Cloud Infrastructure
# ═══════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - PR targeting main when infrastructure/terraform/** changes
#     → fmt check, validate, plan (posted as PR comment)
#   - Push to main when infrastructure/terraform/** changes
#     → plan + apply (with manual approval gate)
#   - Manual dispatch with mode selection (plan / apply / destroy)
#
# Required secrets:
#   HCLOUD_TOKEN   — Hetzner Cloud API token
#   TF_API_TOKEN   — Terraform Cloud API token (for remote state)
#   SSH_PUBLIC_KEY  — SSH public key content (e.g., "ssh-rsa AAAA...")
# ═══════════════════════════════════════════════════════════════════════

name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform operation mode"
        required: true
        type: choice
        options:
          - plan-only
          - apply
          - destroy
      confirm_destroy:
        description: "Type 'destroy-jarble-infrastructure' to confirm destroy"
        required: false
        type: string

env:
  TF_WORKING_DIR: infrastructure/terraform
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Format Check & Validation ────────────────────────────────────
  check:
    name: Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

  # ── Plan ─────────────────────────────────────────────────────────
  plan:
    name: Plan
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          set +e

          if [ "${{ github.event.inputs.mode }}" = "destroy" ]; then
            terraform plan -destroy -no-color -input=false -detailed-exitcode 2>&1 | tee plan_output.txt
          else
            terraform plan -no-color -input=false -detailed-exitcode 2>&1 | tee plan_output.txt
          fi

          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Terraform plan: no changes detected."
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Terraform plan: changes detected."
          else
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Post Plan to PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infrastructure/terraform/plan_output.txt', 'utf8');

            // Truncate if too long for a GH comment (max 65536 chars)
            const maxLen = 60000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n\n... (truncated)'
              : planOutput;

            const body = `### Terraform Plan

            <details><summary>Show plan output</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            *Triggered by @${context.actor} in commit ${context.sha.substring(0, 7)}*`;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Terraform Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ── Apply ────────────────────────────────────────────────────────
  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply'
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  # ── Destroy ──────────────────────────────────────────────────────
  destroy:
    name: Destroy
    needs: plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy-jarble-infrastructure'
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
