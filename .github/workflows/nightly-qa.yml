name: Nightly QA (Agentic)

on:
  # schedule:
  #   - cron: '30 3 * * *'  # 3:30 AM UTC (11:30 PM EDT) every night
  # Disabled: running locally instead to use Max subscription (no API key cost)
  workflow_dispatch:       # Manual trigger (keep for occasional CI runs)
    inputs:
      focus:
        description: 'Focus area (e.g., "dashboard", "chat", "api")'
        required: false
        type: string
      cycles:
        description: 'Number of QA cycles to run'
        required: false
        default: '3'
        type: string
      target:
        description: 'Target environment (cloud or local)'
        required: false
        default: 'cloud'
        type: choice
        options:
          - cloud
          - local

jobs:
  nightly-qa:
    name: Agentic QA
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      AUTH0_DOMAIN: jarble-dev.us.auth0.com
      AUTH0_AUDIENCE: https://api.jarble.ai
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_M2M_CLIENT_ID: ${{ secrets.QA_M2M_CLIENT_ID }}
      QA_M2M_CLIENT_SECRET: ${{ secrets.QA_M2M_CLIENT_SECRET }}
      QA_ANTHROPIC_KEY: ${{ secrets.QA_ANTHROPIC_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            jarble-api-main/package-lock.json
            Jarble-mvp/package-lock.json

      # Configure git for healer PRs
      - name: Configure git
        run: |
          git config user.name "jarble-qa-bot[bot]"
          git config user.email "jarble-qa-bot[bot]@users.noreply.github.com"

      # Install Claude Code CLI
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Install Playwright browsers for UI testing
      - name: Install Playwright
        run: npx playwright install chromium

      # Verify cloud services are reachable
      - name: Health check
        if: ${{ github.event.inputs.target != 'local' }}
        run: |
          echo "Checking cloud services..."
          curl -f https://api.jarble.ai/health || { echo "API not reachable"; exit 1; }
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" https://dev.jarble.ai)
          if [ "$STATUS" -ge 500 ]; then
            echo "Frontend returned $STATUS"; exit 1
          fi
          echo "Cloud services are healthy (frontend: $STATUS, API: ok)."

      # Local mode: start dev servers (for local testing only)
      - name: Start local servers
        if: ${{ github.event.inputs.target == 'local' }}
        run: |
          cd jarble-api-main && npm ci
          cd ../Jarble-mvp && npm ci
          cd ../jarble-api-main
          npx cross-env USE_SQLITE=true NODE_ENV=development tsx src/index.ts &
          sleep 10
          curl -f http://localhost:3001/health
          cd ../Jarble-mvp
          npx next dev -p 3000 &
          sleep 20
          curl -f http://localhost:3000 || true

      # Run QA against cloud (default) or local
      - name: Run agentic QA
        run: |
          FOCUS="${{ github.event.inputs.focus }}"
          CYCLES="${{ github.event.inputs.cycles || '3' }}"
          TARGET="${{ github.event.inputs.target || 'cloud' }}"

          if [ "$TARGET" = "local" ]; then
            BASE="http://localhost:3000"
            API="http://localhost:3001"
          else
            BASE="https://dev.jarble.ai"
            API="https://api.jarble.ai"
          fi

          ARGS="--base-url $BASE --api-url $API --cycles $CYCLES --max-budget 30 --nightly-budget 100 --interval 5"
          if [ -n "$FOCUS" ]; then
            ARGS="$ARGS --focus \"$FOCUS\""
          fi
          node scripts/nightly-qa/overnight-agent.mjs $ARGS --verbose
        timeout-minutes: 90

      # Upload reports
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_number }}
          path: scripts/nightly-qa/reports/
          retention-days: 30

      # Upload agent memory updates
      - name: Upload agent memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-memory-${{ github.run_number }}
          path: .claude/agent-memory/qa/
          retention-days: 30

      # Commit memory updates back to develop
      - name: Commit agent memory
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/agent-memory/qa/ || true
          git diff --cached --quiet || git commit -m "chore: update QA agent memory [skip ci]"
          git push origin develop || true

      # Post summary as check annotation
      - name: Post QA summary
        if: always()
        run: |
          LATEST=$(ls -t scripts/nightly-qa/reports/*-raw.txt 2>/dev/null | head -1)
          if [ -f "$LATEST" ]; then
            echo "## QA Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extract the cycle complete block
            sed -n '/=== QA CYCLE COMPLETE ===/,/=== END CYCLE ===/p' "$LATEST" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No structured summary found" >> $GITHUB_STEP_SUMMARY
          else
            echo "No QA reports generated" >> $GITHUB_STEP_SUMMARY
          fi
