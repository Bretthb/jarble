apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-${SLUG}
  namespace: jarble-preview
  labels:
    app: jarble-preview
    preview-slug: "${SLUG}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jarble-preview
      preview-slug: "${SLUG}"
  template:
    metadata:
      labels:
        app: jarble-preview
        preview-slug: "${SLUG}"
    spec:
      containers:
      - name: frontend
        image: ghcr.io/jarble-ai/frontend:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /_next/static/
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /_next/static/
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
      imagePullSecrets:
      - name: ghcr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: preview-${SLUG}
  namespace: jarble-preview
  labels:
    app: jarble-preview
    preview-slug: "${SLUG}"
spec:
  selector:
    app: jarble-preview
    preview-slug: "${SLUG}"
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preview-${SLUG}
  namespace: jarble-preview
  labels:
    app: jarble-preview
    preview-slug: "${SLUG}"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: ${DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: preview-${SLUG}
            port:
              number: 3000
  tls:
  - hosts:
    - ${DOMAIN}
    secretName: preview-wildcard-tls
