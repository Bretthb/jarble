apiVersion: v1
kind: Namespace
metadata:
  name: jarble-preview
  labels:
    purpose: preview-deployments
    app.kubernetes.io/part-of: jarble-infrastructure
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-quota
  namespace: jarble-preview
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: "2Gi"
    limits.cpu: "2000m"
    limits.memory: "3Gi"
    pods: "12"
    services: "12"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: preview-limits
  namespace: jarble-preview
spec:
  limits:
  - default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "128Mi"
    type: Container
