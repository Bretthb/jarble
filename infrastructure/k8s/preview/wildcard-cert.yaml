# Step 1: Store Cloudflare API token (apply manually with real value):
#
#   kubectl create secret generic cloudflare-api-token \
#     -n cert-manager \
#     --from-literal=api-token=<YOUR_CLOUDFLARE_API_TOKEN>
#
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns
spec:
  acme:
    email: brett@jarble.ai
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-dns-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
        - "jarble.ai"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-wildcard-tls
  namespace: jarble-preview
spec:
  secretName: preview-wildcard-tls
  issuerRef:
    name: letsencrypt-prod-dns
    kind: ClusterIssuer
  dnsNames:
  - "*.preview.jarble.ai"
