# Test Secret for operator evaluation
#
# Replace placeholder values before applying:
#   - OPENCLAW_GATEWAY_TOKEN: generate with `openssl rand -hex 32`
#   - LLM key: add one of ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.
#
# Usage:
#   kubectl apply -f test-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: secret-test-eval-001
  namespace: jarble-eval
  labels:
    app: dep-test-eval-001
    jarble.ai/deployment-id: "test-eval-001"
type: Opaque
stringData:
  # ── Always present ──────────────────────────────────────────────────
  DEPLOYMENT_ID: "test-eval-001"
  USER_ID: "test-user-001"
  DEPLOYMENT_NAME: "Eval Test Agent"
  TEMPLATE: "personal"
  RUNTIME: "openclaw"
  OPENCLAW_GATEWAY_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"

  # ── LLM Provider (pick one) ────────────────────────────────────────
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-sonnet-4-20250514"
  ANTHROPIC_API_KEY: "REPLACE_WITH_REAL_KEY"
  # OPENAI_API_KEY: ""
  # OPENROUTER_API_KEY: ""
  # GOOGLE_API_KEY: ""

  # ── Platform tokens (optional for eval) ─────────────────────────────
  # TELEGRAM_BOT_TOKEN: ""
  # DISCORD_BOT_TOKEN: ""
  # SLACK_BOT_TOKEN: ""
  # SLACK_APP_TOKEN: ""
