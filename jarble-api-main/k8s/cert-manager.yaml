# ═══════════════════════════════════════════════════════════════════════
# cert-manager ClusterIssuer — Jarble AI Platform
# ═══════════════════════════════════════════════════════════════════════
#
# Creates a Let's Encrypt production issuer using HTTP-01 challenges
# through Traefik (K3s built-in ingress controller).
#
# Prerequisites:
#   - cert-manager must be installed in the cluster first:
#     kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.5/cert-manager.yaml
#
# Usage:
#   kubectl apply -f k8s/cert-manager.yaml
#   kubectl apply -f k8s/deployment.yaml   # Ingress references this issuer
#
# Verify:
#   kubectl get clusterissuer
#   kubectl get certificate -n jarble
# ═══════════════════════════════════════════════════════════════════════
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production ACME server
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for certificate expiry notifications
    email: brett@jarble.ai
    # Secret to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    # HTTP-01 challenge: cert-manager creates a temporary Ingress route
    # for the ACME challenge through Traefik
    - http01:
        ingress:
          class: traefik
