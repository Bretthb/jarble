apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarble-api
  namespace: jarble
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jarble-api-role
  namespace: jarble
rules:
- apiGroups: [""]
  resources: ["pods", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jarble-api-binding
  namespace: jarble
subjects:
- kind: ServiceAccount
  name: jarble-api
  namespace: jarble
roleRef:
  kind: Role
  name: jarble-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarble-api
  namespace: jarble
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarble-api
  template:
    metadata:
      labels:
        app: jarble-api
    spec:
      serviceAccountName: jarble-api
      containers:
      - name: api
        image: jarble/api:latest
        ports:
        - containerPort: 3001
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - secretRef:
            name: jarble-api-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jarble-api
  namespace: jarble
spec:
  selector:
    app: jarble-api
  ports:
  - port: 80
    targetPort: 3001
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarble-api
  namespace: jarble
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: api.jarble.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jarble-api
            port:
              number: 80
